services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ledgergate
      POSTGRES_USER: ledgergate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LEDGERGATE_RUNTIME_PASSWORD: ${LEDGERGATE_RUNTIME_PASSWORD:?Set LEDGERGATE_RUNTIME_PASSWORD in .env}
    volumes:
      - ledgergate_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-create-runtime-role.sh:/docker-entrypoint-initdb.d/01-create-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgergate -d ledgergate"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledgergate:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ledgergate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledgergate_runtime:${LEDGERGATE_RUNTIME_PASSWORD:?Set LEDGERGATE_RUNTIME_PASSWORD in .env}@db:5432/ledgergate
      UPLOAD_DIR: /app/uploads
    # Bind to loopback by default; expose through a TLS reverse proxy in production.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ledgergate_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_DOCS_URL: http://localhost:8000/docs
    # Keep the frontend local unless an external TLS proxy is configured.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ledgergate_pgdata:
  ledgergate_uploads:
