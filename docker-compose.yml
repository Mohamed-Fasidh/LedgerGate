services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ledgergate
      POSTGRES_USER: ledgergate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - ledgergate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgergate -d ledgergate"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledgergate:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/ledgergate
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8000:8000"
    volumes:
      - ledgergate_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.2
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ledgergate_pgdata:
  ledgergate_uploads:
