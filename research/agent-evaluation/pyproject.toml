[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgergate-agent-evaluation"
version = "1.0.0"
description = "Deterministic, versioned AI-agent evaluation and reliability framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]

[project.scripts]
ledgergate-eval = "eval_framework.cli:main"

[tool.setuptools]
packages = ["eval_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
