name: Cleanup cancelled workflow runs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-cancelled-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete cancelled workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Remove cancelled runs only
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: "completed",
                per_page: 100
              }
            );

            const cancelled = runs.filter(run => run.conclusion === "cancelled");
            core.info(`Found ${cancelled.length} cancelled workflow run(s).`);

            let deleted = 0;
            for (const run of cancelled) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              deleted += 1;
              core.info(`Deleted cancelled run ${run.id}: ${run.name}`);
            }

            core.info(`Cleanup complete. Deleted ${deleted} cancelled run(s); successful and failed runs were preserved.`);
