name: Cleanup failed and cancelled workflow runs

on:
  workflow_dispatch:
  # GitHub Actions scheduled workflows have a minimum supported interval of
  # five minutes; a one-minute schedule is not supported.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-failed-cancelled-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove completed failed and cancelled runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete completed failed and cancelled workflow runs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup_workflow_runs.sh
