name: Reinforcement Learning Research CI

on:
  pull_request:
    branches: [main]
    paths:
      - "research/reinforcement-learning/**"
      - ".github/workflows/research-rl.yml"
  push:
    branches: [main]
    paths:
      - "research/reinforcement-learning/**"
      - ".github/workflows/research-rl.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rl-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rl-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/reinforcement-learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/reinforcement-learning/pyproject.toml
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run RL algorithm unit tests
        run: python -m pytest -q
      - name: Smoke-test unified CPU experiment runner
        run: python -m rl_research.run_all --only grpo --device cpu --output /tmp/rl-ci-output --threads 1
