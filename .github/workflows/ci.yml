name: LedgerGate CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgergate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app migrations
      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-ledgergate.db
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production-000000
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_API_DOCS_URL: https://api.example.invalid/docs
        run: npm run build
