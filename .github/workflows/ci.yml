name: LedgerGate CI

on:
  # Verify pull requests before merge and the exact release commit after merge.
  pull_request:
    branches: [main, security/strict-audit-export-validation, security/harden-public-app-origin-validation]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgergate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ledgergate
          POSTGRES_USER: ledgergate
          POSTGRES_PASSWORD: ledgergate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgergate -d ledgergate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ledgergate:ledgergate_ci_password@localhost:5432/ledgergate
      TEST_POSTGRES_URL: postgresql+psycopg://ledgergate:ledgergate_ci_password@localhost:5432/ledgergate
      MIGRATION_DATABASE_URL: postgresql+psycopg://ledgergate:ledgergate_ci_password@localhost:5432/ledgergate
      DB_RUNTIME_PASSWORD: runtime_ci_password
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate database role bootstrap scripts
        run: sh -n ./scripts/bootstrap_auth_owner_role.sh ./scripts/bootstrap_runtime_role.sh
      - name: Bootstrap non-login authentication function owner
        run: sh ./scripts/bootstrap_auth_owner_role.sh
      - run: alembic upgrade head
      - name: Bootstrap restricted runtime role
        run: sh ./scripts/bootstrap_runtime_role.sh
      - run: python -m compileall -q app migrations
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - name: Report frontend dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));'
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate operational scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_drill_postgres.sh scripts/cleanup_workflow_runs.sh
      - name: Enforce immutable GitHub Actions references
        run: python3 scripts/test_workflow_action_pins.py
      - name: Test workflow-run cleanup safety
        run: python3 scripts/test_cleanup_workflow_runs.py
      - name: Guard production API startup and one-shot migrations
        run: python3 scripts/test_production_container_startup.py
      - name: Test PostgreSQL backup publication and failure cleanup
        run: python3 scripts/test_backup_postgres.py
      - name: Test PostgreSQL restore drill verification and cleanup
        run: python3 scripts/test_restore_drill_postgres.py
      - name: Test non-root containers and service health checks
        run: python3 scripts/test_container_hardening.py
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build api web
