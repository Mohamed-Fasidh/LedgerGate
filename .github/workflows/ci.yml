name: LedgerGate CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ledgergate
          POSTGRES_USER: ledgergate
          POSTGRES_PASSWORD: ledgergate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgergate -d ledgergate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ledgergate:ledgergate_ci_password@localhost:5432/ledgergate
      TEST_POSTGRES_URL: postgresql+psycopg://ledgergate:ledgergate_ci_password@localhost:5432/ledgergate
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Create restricted runtime role for RLS tests
        run: |
          PGPASSWORD=ledgergate_ci_password psql -h localhost -U ledgergate -d ledgergate -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ledgergate_runtime LOGIN PASSWORD 'runtime_ci_password' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT ON DATABASE ledgergate TO ledgergate_runtime;
          GRANT USAGE ON SCHEMA public TO ledgergate_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ledgergate_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ledgergate_runtime;
          SQL
      - run: python -m compileall -q app migrations
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
