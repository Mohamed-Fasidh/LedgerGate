name: Cleanup cancelled and failed workflow runs

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum interval.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-failed-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete cancelled and failed runs
    runs-on: ubuntu-latest
    steps:
      - name: Remove cancelled and failed runs only
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: "completed",
                per_page: 100
              }
            );

            const disposable = runs.filter(
              run => run.conclusion === "cancelled" || run.conclusion === "failure"
            );
            core.info(`Found ${disposable.length} cancelled or failed workflow run(s).`);

            let deleted = 0;
            for (const run of disposable) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              deleted += 1;
              core.info(`Deleted ${run.conclusion} run ${run.id}: ${run.name}`);
            }

            core.info(`Cleanup complete. Deleted ${deleted} cancelled/failed run(s); successful runs were preserved.`);
