name: Cleanup failed workflow history

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports scheduled workflows at a minimum of every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-history-maintenance
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete completed failed and cancelled runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup_workflow_runs.sh
