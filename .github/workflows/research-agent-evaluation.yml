name: Agent Evaluation Research CI

on:
  pull_request:
    branches: [main]
    paths:
      - "research/agent-evaluation/**"
      - ".github/workflows/research-agent-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "research/agent-evaluation/**"
      - ".github/workflows/research-agent-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/agent-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/agent-evaluation/pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Validate versioned evaluation dataset
        run: python -m eval_framework.cli validate-dataset
      - name: Run evaluation package tests
        run: python -m pytest -q
      - name: Run deterministic CI evaluation gates
        run: python -m eval_framework.cli run --ci --model-version synthetic-fixtures --output-dir /tmp/ledgergate-evaluation-ci
