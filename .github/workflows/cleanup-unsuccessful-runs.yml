name: Clean up failed and cancelled workflow runs

on:
  # GitHub scheduled workflows have a minimum interval of 5 minutes.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-run-cleanup
  cancel-in-progress: false

jobs:
  delete-unsuccessful-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed failed and cancelled runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(.status == "completed")
                | select(.conclusion == "failure"
                      or .conclusion == "cancelled")
                | .id'
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No completed failed or cancelled workflow runs to delete."
            exit 0
          fi

          for run_id in "${run_ids[@]}"; do
            echo "Deleting workflow run ${run_id}"
            gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"
          done

          echo "Deleted ${#run_ids[@]} unsuccessful workflow run(s)."
