name: Clean up failed and cancelled workflow runs

on:
  # GitHub scheduled workflows have a minimum interval of 5 minutes.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-run-cleanup
  cancel-in-progress: false

jobs:
  delete-unsuccessful-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete completed failed and cancelled runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: bash scripts/cleanup_workflow_runs.sh
