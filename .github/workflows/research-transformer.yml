name: Transformer Research CI

on:
  pull_request:
    branches: [main]
    paths:
      - "research/transformer/**"
      - ".github/workflows/research-transformer.yml"
  push:
    branches: [main]
    paths:
      - "research/transformer/**"
      - ".github/workflows/research-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transformer-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transformer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/transformer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/transformer/pyproject.toml
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Transformer unit tests
        run: python -m pytest -q
